<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>serve-droid hub</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --surface: #161616;
    --surface-hover: #222;
    --line: #262626;
    --text: #ededed;
    --muted: #8a8a8a;
    --live: #4ade80;
    --wait: #facc15;
    --danger: #f87171;
    --gutter: 24px;
    --mono: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px var(--gutter) 0;
    font: var(--mono);
    color: var(--muted);
  }
  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 32px var(--gutter);
    padding: 28px var(--gutter) max(28px, env(safe-area-inset-bottom));
    max-width: 1400px;
  }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    color: inherit;
    text-decoration: none;
    border-radius: 20px;
    outline: none;
  }
  .device {
    width: 100%;
    max-width: 240px;
    padding: 6px;
    border-radius: 22px;
    background: #000;
    box-shadow: 0 0 0 1px #2e2e2e, 0 0 0 2px #111, 0 16px 48px rgba(0, 0, 0, 0.55);
    transition: transform 160ms cubic-bezier(0.2, 0, 0, 1), box-shadow 160ms ease;
  }
  .tile:hover .device, .tile:focus-visible .device {
    transform: translateY(-3px);
    box-shadow: 0 0 0 1px #4a4a4a, 0 0 0 2px #111, 0 20px 56px rgba(0, 0, 0, 0.65);
  }
  .tile:focus-visible .device { box-shadow: 0 0 0 2px var(--text), 0 20px 56px rgba(0, 0, 0, 0.65); }
  .screen {
    position: relative;
    aspect-ratio: var(--ar, 0.4737);
    border-radius: 16px;
    overflow: hidden;
    background: #050505;
  }
  .screen img { width: 100%; height: 100%; display: block; object-fit: cover; opacity: 0; transition: opacity 200ms ease; }
  .screen img.ready { opacity: 1; }
  .screen .note {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    text-align: center;
    font: var(--mono);
    color: var(--muted);
  }
  .screen img.ready + .note { display: none; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    max-width: 100%;
    height: 32px;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    font-weight: 500;
    white-space: nowrap;
  }
  .tile:hover .badge { background: var(--surface-hover); }
  .badge .name { overflow: hidden; text-overflow: ellipsis; }
  .state {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    font: var(--mono);
    color: var(--wait);
  }
  .state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .state.live { color: var(--live); }
  .state.off { color: var(--danger); }
  .meta {
    max-width: 100%;
    margin-top: -8px;
    font: var(--mono);
    color: var(--muted);
    text-align: center;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .urls { width: 100%; max-width: 240px; font: var(--mono); color: var(--muted); }
  .urls summary {
    width: max-content;
    margin: 0 auto;
    padding: 2px 8px;
    border-radius: 6px;
    list-style: none;
    cursor: pointer;
  }
  .urls summary::-webkit-details-marker { display: none; }
  .urls summary:hover, .urls[open] summary { color: var(--text); }
  .urls summary:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .urls ul { margin: 8px 0 0; padding: 4px; list-style: none; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .urls button {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    gap: 8px;
    width: 100%;
    padding: 6px 8px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--text);
    font: var(--mono);
    text-align: left;
    cursor: copy;
  }
  .urls button:hover, .urls button:focus-visible { background: var(--surface-hover); outline: none; }
  .urls button span:first-child { color: var(--muted); }
  .urls button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .urls button.copied span:last-child { color: var(--live); }
  .add .device {
    display: grid;
    background: none;
    box-shadow: none;
    border: 1px dashed #3a3a3a;
  }
  .add .screen { display: grid; place-items: center; background: none; aspect-ratio: 0.4737; color: var(--muted); font-size: 40px; font-weight: 200; }
  .add:hover .device, .add:focus-visible .device { border-color: #5a5a5a; box-shadow: none; }
  .add:hover .screen { color: var(--text); }
  button.tile { width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  form.new {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 240px;
    padding: 14px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  form.new label { display: flex; flex-direction: column; gap: 4px; font: var(--mono); color: var(--muted); }
  form.new input, form.new select {
    height: 34px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form.new input:focus-visible, form.new select:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  form.new .actions { display: flex; gap: 8px; margin-top: 4px; }
  form.new button {
    flex: 1;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-hover);
    color: var(--text);
    font: 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: pointer;
  }
  form.new button[type=submit] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
  form.new .error { margin: 0; font: var(--mono); color: var(--danger); }
  .pending .device { opacity: 0.85; }
  .pending .note { font-size: 12px; }
  .dismiss { border: 0; background: none; color: var(--muted); font: var(--mono); cursor: pointer; padding: 2px 8px; border-radius: 6px; }
  .dismiss:hover { color: var(--text); }
  .empty {
    grid-column: 1 / -1;
    padding: 80px 0;
    text-align: center;
    color: var(--muted);
  }
  .empty code {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    font: var(--mono);
    color: var(--text);
  }
  @media (max-width: 520px) {
    :root { --gutter: 16px; }
    main { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 16px; }
    .device { padding: 4px; border-radius: 18px; }
    .screen { border-radius: 14px; }
    .badge { height: 28px; padding: 0 10px; gap: 8px; font-size: 13px; }
    .state { font-size: 12px; }
    .meta { font-size: 12px; }
  }
</style>
</head>
<body>
<header>serve-droid hub</header>
<main id="grid" aria-live="polite"></main>
<script>
  "use strict";
  const grid = document.getElementById("grid");
  const tiles = new Map();
  let choices = {}, adding = null;
  const FRAME_MS = 1000;
  const LIST_MS = 5000;

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  function setState(tile, kind, text) {
    tile.state.className = `state ${kind}`;
    tile.state.textContent = text;
  }

  // Poll one small JPEG per tile while it is on screen and the page is visible.
  async function pump(tile) {
    while (tiles.get(tile.name) === tile) {
      if (tile.visible && document.visibilityState === "visible") {
        try {
          // Ask for about the tile's pixel size: sharp on HiDPI, small on the wire.
          const edge = Math.min(768, Math.max(160, Math.round((tile.screen.clientHeight || 400) * devicePixelRatio)));
          const r = await fetch(`${tile.path}api/frame?max_edge=${edge}`, { cache: "no-store" });
          const f = await r.json();
          if (!r.ok || !f.data) throw new Error(f.error || r.statusText);
          tile.img.src = `data:${f.mimeType};base64,${f.data}`;
          tile.img.classList.add("ready");
          tile.screen.style.setProperty("--ar", f.screenWidth / f.screenHeight || 0.4737);
          setState(tile, "live", "live");
        } catch {
          tile.img.classList.remove("ready");
          tile.note.textContent = "Booting…";
          setState(tile, "", "waiting");
        }
      }
      await new Promise(resolve => setTimeout(resolve, FRAME_MS));
    }
  }

  const seen = new IntersectionObserver(entries => {
    for (const entry of entries) {
      const tile = [...tiles.values()].find(t => t.link === entry.target);
      if (tile) tile.visible = entry.isIntersecting;
    }
  });

  // "Samsung Galaxy S10, Android 16" → "Galaxy S10 · Android 16"; it may wrap but never truncates.
  function shortDevice(device = "") {
    return (device || "").replace(/^Samsung\s+/, "").replace(/,\s*(Android)/, " · $1");
  }

  const URL_ROWS = [["Stream", "stream"], ["Video", "video"], ["AVCC", "avcc"], ["WS", "ws"], ["Input", "input"]];

  // "…/d/NAME/stream.mjpeg?token=…" → "stream.mjpeg"; "…/ws?token=…&video=none" → "ws?video=none".
  function shortUrl(href) {
    const url = new URL(href);
    url.searchParams.delete("token");
    return url.pathname.split("/").pop() + url.search;
  }

  // Click a row to copy its URL. The token, if any, is part of it.
  function urlList(urls) {
    const list = el("ul");
    for (const [label, key] of URL_ROWS) {
      if (!urls[key]) continue;
      const button = el("button", { type: "button", title: `Copy ${urls[key]}` }, el("span", { textContent: label }), el("span", { textContent: shortUrl(urls[key]) }));
      button.addEventListener("click", async () => {
        await navigator.clipboard?.writeText(urls[key]).catch(() => {});
        button.classList.add("copied");
        setTimeout(() => button.classList.remove("copied"), 1200);
      });
      list.append(el("li", {}, button));
    }
    return el("details", { className: "urls" }, el("summary", { textContent: "URLs" }), list);
  }

  function pendingTile(session) {
    const failed = session.state === "failed";
    const note = el("div", { className: "note", textContent: session.progress || "Starting…" });
    const state = el("span", { className: `state ${failed ? "off" : ""}`, textContent: failed ? "failed" : "starting" });
    const parts = [el("div", { className: "tile pending" },
      el("div", { className: "device" }, el("div", { className: "screen" }, note)),
      el("div", { className: "badge" }, el("span", { className: "name", textContent: session.name }), state))];
    if (session.device) parts.push(el("div", { className: "meta", textContent: shortDevice(session.device) }));
    if (failed) {
      const dismiss = el("button", { type: "button", className: "dismiss", textContent: "Dismiss" });
      dismiss.addEventListener("click", async () => {
        await fetch(`api/sessions/${encodeURIComponent(session.name)}`, { method: "DELETE" });
        refresh();
      });
      parts.push(dismiss);
    }
    return el("div", { className: "cell" }, ...parts);
  }

  function nextName() {
    for (let i = 1; ; i++) if (!tiles.has(`emulator-${i}`)) return `emulator-${i}`;
  }

  function addCell() {
    if (!adding) {
      const button = el("button", { type: "button", className: "tile add", title: "Start another emulator" },
        el("div", { className: "device" }, el("div", { className: "screen", textContent: "+" })),
        el("div", { className: "badge" }, el("span", { className: "name", textContent: "New emulator" })));
      button.addEventListener("click", () => { adding = { name: nextName() }; render(lastSessions); });
      return el("div", { className: "cell" }, button);
    }
    const name = el("input", { name: "name", value: adding.name, required: true, pattern: "[A-Za-z0-9_-]{1,100}", autocomplete: "off", spellcheck: false });
    const fields = [el("label", {}, "Name", name)];
    const select = (label, key, values, value) => {
      const node = el("select", { name: key }, ...values.map(v => el("option", { value: v, textContent: key === "android" ? `Android ${v.replace(/\.0$/, "")}` : v.replace(/^Samsung /, ""), selected: v === value })));
      fields.push(el("label", {}, label, node));
    };
    if (choices.devices?.length) select("Device", "device", choices.devices, "Samsung Galaxy S10");
    if (choices.android?.length) select("Android", "android", choices.android, "16.0");
    const error = el("p", { className: "error", hidden: true });
    const cancel = el("button", { type: "button", textContent: "Cancel" });
    cancel.addEventListener("click", () => { adding = null; render(lastSessions); });
    const form = el("form", { className: "new" }, ...fields, error,
      el("div", { className: "actions" }, cancel, el("button", { type: "submit", textContent: "Start" })));
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = Object.fromEntries(new FormData(form));
      const r = await fetch("api/sessions", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const reply = await r.json().catch(() => ({}));
      if (!r.ok) {
        error.textContent = reply.error || r.statusText;
        error.hidden = false;
        return;
      }
      adding = null;
      refresh();
    });
    name.addEventListener("input", () => { adding.name = name.value; });
    queueMicrotask(() => name.focus());
    return el("div", { className: "cell" }, form);
  }

  function addTile(session) {
    const img = el("img", { alt: `${session.name} screen` });
    const note = el("div", { className: "note", textContent: "Connecting…" });
    const screen = el("div", { className: "screen" }, img, note);
    const state = el("span", { className: "state", textContent: "connecting" });
    const meta = el("div", { className: "meta", textContent: shortDevice(session.device), title: session.device || "" });
    const link = el("a", { className: "tile", href: session.path, title: `Open ${session.name}` },
      el("div", { className: "device" }, screen),
      el("div", { className: "badge" }, el("span", { className: "name", textContent: session.name }), state),
      meta);
    const urls = urlList(session.urls || {});
    const cell = el("div", { className: "cell" }, link, urls);
    const tile = { name: session.name, path: session.path, link, cell, urls, img, note, screen, state, visible: true };
    tiles.set(session.name, tile);
    seen.observe(link);
    pump(tile);
    return tile;
  }

  let lastSessions = [];

  function render(sessions) {
    lastSessions = sessions;
    const running = sessions.filter(s => s.state === "running");
    const names = new Set(running.map(s => s.name));
    for (const [name, tile] of tiles) {
      if (!names.has(name)) {
        seen.unobserve(tile.link);
        tile.cell.remove();
        tiles.delete(name);
      }
    }
    // Keep the form and open URL lists in place across polls.
    const form = grid.querySelector("form.new")?.closest(".cell");
    grid.replaceChildren(...sessions.map(s => s.state === "running" ? (tiles.get(s.name) ?? addTile(s)).cell : pendingTile(s)),
      adding && form ? form : addCell());
  }

  async function refresh() {
    try {
      const r = await fetch("api/sessions", { cache: "no-store" });
      const body = await r.json();
      if (r.ok) {
        choices = body.choices || {};
        render(body.sessions);
      }
    } catch {
      // Keep the last list; the next poll retries.
    }
  }

  refresh();
  setInterval(refresh, LIST_MS);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
</script>
</body>
</html>
