<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>serve-droid</title>
<style>
  @property --panel-w { syntax: "<length>"; inherits: true; initial-value: 0px; }
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --surface: #161616;
    --surface-hover: #222;
    --line: #262626;
    --text: #ededed;
    --muted: #8a8a8a;
    --live: #4ade80;
    --wait: #facc15;
    --chrome: 168px;
    --gutter: 24px;
    --ar: 0.4737;
    --panel: 340px;
    --panel-w: 0px;
    --danger: #f87171;
    transition: --panel-w 220ms cubic-bezier(0.2, 0, 0, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    flex: 1;
    min-width: 0;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  header {
    display: flex;
    align-items: center;
    padding: 16px var(--gutter) 0;
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
  }
  main {
    grid-row: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 0 var(--gutter) max(20px, env(safe-area-inset-bottom));
    min-height: 0;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 32px;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    font-weight: 500;
    white-space: nowrap;
  }
  .state {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--wait);
  }
  .state::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  .state.live { color: var(--live); }
  .device {
    --screen-h: min(calc((100dvh - var(--chrome)) / 1.036), calc((100vw - var(--panel-w) - 2 * var(--gutter)) / (var(--ar) + 0.036)), 1100px);
    --bezel: calc(var(--screen-h) * 0.018);
    padding: var(--bezel);
    border-radius: calc(var(--bezel) * 3);
    background: #000;
    box-shadow: 0 0 0 1px #2e2e2e, 0 0 0 calc(var(--bezel) * 0.35) #111, 0 24px 80px rgba(0, 0, 0, 0.6);
  }
  .screen {
    position: relative;
    display: block;
    height: var(--screen-h);
    aspect-ratio: var(--ar);
    border-radius: calc(var(--bezel) * 1.8);
    overflow: hidden;
    background: #050505;
    outline: none;
    touch-action: none;
    cursor: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .touch-dot {
    position: absolute;
    top: 0;
    left: 0;
    width: 30px;
    height: 30px;
    margin: -15px 0 0 -15px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 120ms ease;
    will-change: transform;
  }
  .touch-dot span {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.9), 0 1px 8px rgba(0, 0, 0, 0.35);
    transition: transform 120ms ease, background-color 120ms ease;
  }
  .touch-dot.on { opacity: 1; }
  .touch-dot.pair span { background: rgba(255, 255, 255, 0.12); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.6), 0 1px 8px rgba(0, 0, 0, 0.35); }
  .touch-dot.down span { transform: scale(0.8); background: rgba(255, 255, 255, 0.45); }
  .screen canvas { width: 100%; height: 100%; display: block; }
  .toolbar { display: flex; gap: 10px; }
  .group {
    display: flex;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  button {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background-color 120ms ease, transform 120ms ease;
  }
  button:hover { background: var(--surface-hover); }
  .panel-toggle {
    position: fixed;
    top: 10px;
    right: 12px;
    z-index: 3;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    color: var(--muted);
  }
  .panel-toggle:hover, .panel-toggle[aria-expanded="true"] { color: var(--text); }
  .panel {
    flex: none;
    width: var(--panel);
    margin-right: calc(var(--panel-w) - var(--panel));
    height: 100dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: #101010;
    border-left: 1px solid var(--line);
    padding: 10px 20px max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel[hidden] { display: flex; visibility: hidden; }
  .panel-tabs { flex: none; margin-right: 44px; }
  .tab { display: flex; flex-direction: column; gap: 24px; }
  .tab[hidden] { display: none; }
  .log-open { --panel: min(620px, 46vw); }
  .log-open .panel, .events-open .panel { overflow: hidden; }
  #tab-logcat, #tab-events { flex: 1; min-height: 0; gap: 10px; }
  .log-tools { display: flex; gap: 8px; }
  .log-tools input { flex: 1; }
  .log-tools select {
    flex: none;
    height: 36px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  .log-tools button {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    color: var(--muted);
  }
  .log-tools button:hover, .log-tools button[aria-pressed="true"] { color: var(--text); }
  .log-tools button:disabled { opacity: 0.4; cursor: default; }
  .log-tools button svg { width: 18px; height: 18px; }
  .log-app { color: var(--muted); }
  .log {
    flex: 1;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    margin: 0 -20px;
    padding: 6px 20px 12px;
    border-top: 1px solid var(--line);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  .log div { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1px 0 1px 2ch; text-indent: -2ch; }
  .log div:hover { background: #161616; }
  .log .ts { color: #5c5c5c; }
  .log .lv { font-weight: 600; }
  .log .tag { color: #b5b5b5; }
  .log .V .lv, .log .V .msg { color: #6b6b6b; }
  .log .D .lv, .log .D .msg { color: #9a9a9a; }
  .log .I .lv { color: var(--live); }
  .log .W .lv, .log .W .msg { color: var(--wait); }
  .log .E .lv, .log .E .msg, .log .F .lv, .log .F .msg, .log .A .lv, .log .A .msg { color: var(--danger); }
  .log .src { color: #5c5c5c; }
  .log .act { color: #b5b5b5; font-weight: 600; }
  .log .fail .act, .log .fail .msg { color: var(--danger); }
  .log-empty { margin: 24px 0; text-align: center; color: var(--muted); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  .scrim { display: none; }
  section h2 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 28px;
    margin: 0 0 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  section h2 button { width: 28px; height: 28px; margin-right: -6px; color: var(--muted); }
  section h2 button:hover { color: var(--text); }
  section h2 button svg { width: 16px; height: 16px; }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0;
    font-variant-numeric: tabular-nums;
  }
  .row > span:first-child { color: var(--muted); }
  .row > span:last-child { text-align: right; }
  .field { position: relative; display: flex; gap: 8px; }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    min-width: 0;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    outline: none;
    transition: border-color 120ms ease;
  }
  textarea { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; line-height: 1.4; }
  input:focus, textarea:focus { border-color: #4a4a4a; }
  input::placeholder, textarea::placeholder { color: #5c5c5c; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .field .go {
    position: absolute;
    right: 3px;
    top: 3px;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    color: var(--muted);
  }
  .field .go:hover { color: var(--text); }
  .field .go svg { width: 16px; height: 16px; }
  .field input:has(+ .go) { padding-right: 38px; }
  .segmented {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    padding: 3px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .segmented button {
    width: auto;
    height: 30px;
    border-radius: 7px;
    color: var(--muted);
    font: inherit;
  }
  .segmented button[aria-pressed="true"] { background: var(--surface-hover); color: var(--text); }
  input[type="range"] { width: 100%; margin: 6px 0 4px; accent-color: var(--text); }
  .switch {
    appearance: none;
    position: relative;
    width: 34px;
    height: 20px;
    margin: 0;
    border-radius: 999px;
    background: #2a2a2a;
    cursor: pointer;
    transition: background-color 150ms ease;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text);
    transition: transform 150ms ease;
  }
  .switch:checked { background: var(--live); }
  .switch:checked::after { transform: translateX(14px); background: #0a0a0a; }
  .switch:focus-visible { outline: 2px solid #555; outline-offset: 2px; }
  .row:has(.switch) { align-items: center; }
  .wide {
    width: 100%;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    font: inherit;
  }
  .wide.set { width: auto; flex: none; padding: 0 14px; }
  .wide:disabled { opacity: 0.5; cursor: default; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sub { margin: 10px 0 6px; color: var(--muted); }
  .list { list-style: none; margin: 0 -8px; padding: 0; max-height: 252px; overflow-y: auto; overscroll-behavior: contain; }
  .list li { display: flex; align-items: center; gap: 2px; min-height: 36px; padding: 0 2px 0 8px; border-radius: 8px; }
  .list li:hover { background: var(--surface); }
  .list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .list .meta { flex: none; margin-right: 4px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .list button { flex: none; width: 28px; height: 28px; border-radius: 6px; color: var(--muted); }
  .list button:hover { color: var(--text); }
  .list button.confirm { color: var(--danger); background: rgba(248, 113, 113, 0.12); }
  .list button svg { width: 16px; height: 16px; }
  .list .empty { color: var(--muted); }
  .list .empty:hover { background: none; }
  .filter { margin-bottom: 6px; }
  .note { margin: 6px 0 0; font-size: 13px; color: var(--muted); min-height: 0; }
  .note:empty { display: none; }
  .note.error { color: var(--danger); }
  .dropping .screen { box-shadow: 0 0 0 2px var(--live); }
  button:active { transform: scale(0.92); }
  button:focus-visible { outline: 2px solid #555; outline-offset: -2px; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  @media (min-width: 900px) {
    .panel-open { --panel-w: var(--panel); }
  }
  @media (max-width: 899px) {
    .panel {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 2;
      width: min(var(--panel), calc(100vw - 40px));
      margin: 0;
      transform: translateX(100%);
      transition: transform 220ms cubic-bezier(0.2, 0, 0, 1), visibility 0s 220ms;
      box-shadow: -24px 0 60px rgba(0, 0, 0, 0.5);
    }
    .panel-open .panel { transform: none; transition: transform 220ms cubic-bezier(0.2, 0, 0, 1); }
    .log-open .panel { width: calc(100vw - 40px); }
    .scrim {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }
    .panel-open .scrim { opacity: 1; pointer-events: auto; }
  }
  @media (max-width: 520px) {
    .log .ts { display: none; }
    :root { --gutter: 12px; --chrome: 132px; }
    header { display: none; }
    main { gap: 12px; padding-top: max(12px, env(safe-area-inset-top)); }
    .badge { height: 28px; font-size: 13px; }
    .toolbar { gap: 6px; }
    button { width: 36px; height: 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    :root, button, .panel, .scrim, .switch, .switch::after, .touch-dot, .touch-dot span { transition: none !important; }
  }
</style>
</head>
<body>
<div class="stage">
<header>serve-droid</header>
<main>
  <div class="badge"><span id="label">Android</span><span id="state" class="state">connecting</span></div>
  <div class="device">
    <div id="screen" class="screen" tabindex="0" aria-label="Device screen"><canvas id="canvas"></canvas><div class="touch-dot" id="touch-dot" aria-hidden="true"><span></span></div></div>
  </div>
  <nav class="toolbar">
    <div class="group">
      <button data-key="GoBack" aria-label="Back" title="Back"><svg viewBox="0 0 24 24"><path d="M16 5v14L6 12z"/></svg></button>
      <button data-key="GoHome" aria-label="Home" title="Home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></button>
      <button data-key="AppSwitch" aria-label="Recent apps" title="Recent apps"><svg viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/></svg></button>
    </div>
    <div class="group">
      <button data-key="AudioVolumeDown" aria-label="Volume down" title="Volume down"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/></svg></button>
      <button data-key="AudioVolumeUp" aria-label="Volume up" title="Volume up"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button id="rotate" aria-label="Rotate" title="Rotate"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button id="shot" aria-label="Screenshot" title="Screenshot"><svg viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button data-key="Power" aria-label="Power" title="Power"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg></button>
    </div>
  </nav>
</main>
</div>
<div class="scrim" id="scrim"></div>
<button id="panel-toggle" class="panel-toggle" aria-label="Device panel" title="Device panel" aria-expanded="false" aria-controls="panel"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15"/></svg></button>
<aside id="panel" class="panel" aria-label="Device panel" hidden>
  <div class="segmented panel-tabs" role="tablist" aria-label="Panel">
    <button role="tab" data-tab="controls" aria-controls="tab-controls" aria-selected="true" aria-pressed="true">Controls</button>
    <button role="tab" data-tab="logcat" aria-controls="tab-logcat" aria-selected="false" aria-pressed="false">Logcat</button>
    <button role="tab" data-tab="events" aria-controls="tab-events" aria-selected="false" aria-pressed="false">Events</button>
  </div>
  <div class="tab" id="tab-controls" role="tabpanel">
  <section>
    <h2>Device</h2>
    <div class="row"><span>Model</span><span id="i-model">–</span></div>
    <div class="row"><span>Android</span><span id="i-android">–</span></div>
    <div class="row"><span>Display</span><span id="i-display">–</span></div>
    <div class="row"><span>Memory</span><span id="i-memory">–</span></div>
    <div class="row"><span>Emulator</span><span id="i-emulator">–</span></div>
  </section>
  <section>
    <h2><label for="clip">Clipboard</label><button id="clip-copy" aria-label="Copy to this computer" title="Copy to this computer"><svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg></button></h2>
    <textarea id="clip" rows="3" spellcheck="false" placeholder="Empty"></textarea>
    <p class="note" id="clip-note"></p>
  </section>
  <section>
    <h2><label for="url">Open URL</label></h2>
    <form class="field" id="url-form">
      <input id="url" type="text" inputmode="url" placeholder="https://example.com" autocomplete="off" spellcheck="false">
      <button class="go" aria-label="Open" title="Open"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
    </form>
    <p class="note" id="url-note"></p>
  </section>
  <section>
    <h2>Apps<button id="apps-refresh" aria-label="Refresh apps" title="Refresh"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg></button></h2>
    <input id="apps-filter" class="filter" type="text" placeholder="Filter" aria-label="Filter apps" spellcheck="false" autocomplete="off" hidden>
    <ul class="list" id="apps" aria-label="Apps"></ul>
    <div class="row"><span><label for="apps-all">System apps</label></span><input id="apps-all" class="switch" type="checkbox"></div>
    <p class="note" id="apps-note"></p>
  </section>
  <section>
    <h2>Install app</h2>
    <button class="wide" id="apk-pick">Choose APK…</button>
    <input id="apk" type="file" accept=".apk,application/vnd.android.package-archive" hidden>
    <p class="note" id="apk-note">Or drop an APK on the screen.</p>
  </section>
  <section>
    <h2>Snapshots<button id="snaps-refresh" aria-label="Refresh snapshots" title="Refresh"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg></button></h2>
    <ul class="list" id="snaps" aria-label="Snapshots"></ul>
    <form class="field" id="snap-form" style="margin-top: 6px">
      <input id="snap-name" type="text" placeholder="Snapshot name" aria-label="Snapshot name" spellcheck="false" autocomplete="off">
      <button class="wide set" id="snap-save">Save</button>
    </form>
    <p class="note" id="snaps-note"></p>
  </section>
  <section>
    <h2>Appearance</h2>
    <div class="segmented" role="group" aria-label="Appearance">
      <button data-dark="false" aria-pressed="false">Light</button>
      <button data-dark="true" aria-pressed="false">Dark</button>
    </div>
    <p class="note" id="appearance-note"></p>
  </section>
  <section>
    <h2>Accessibility</h2>
    <div class="row"><span><label for="font-scale">Font size</label></span><span id="font-scale-value">–</span></div>
    <input id="font-scale" type="range" min="0" max="6" step="1" value="1" aria-valuetext="Default">
    <p class="note" id="a11y-note"></p>
  </section>
  <section>
    <h2><label for="battery">Battery</label><span id="battery-value"></span></h2>
    <input id="battery" type="range" min="0" max="100" step="1" value="100">
    <div class="row"><span><label for="charging">Charging</label></span><input id="charging" class="switch" type="checkbox"></div>
    <p class="note" id="battery-note"></p>
  </section>
  <section>
    <h2>Location</h2>
    <form class="field" id="loc-form">
      <input id="lat" type="number" step="any" placeholder="Latitude" aria-label="Latitude">
      <input id="lng" type="number" step="any" placeholder="Longitude" aria-label="Longitude">
      <button class="wide set">Set</button>
    </form>
    <p class="note" id="loc-note"></p>
  </section>
  <section>
    <h2>Network</h2>
    <div class="row"><span><label for="net-airplane">Airplane mode</label></span><input id="net-airplane" class="switch" type="checkbox"></div>

</aside>
<script>
  const screen = document.getElementById("screen");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const state = document.getElementById("state");
  let ws, retry = 0, pending = null, decoding = false, shaped = false, deviceSize = null;

  function setState(live) {
    state.textContent = live ? "live" : "connecting";
    state.classList.toggle("live", live);
  }

  function setShape(w, h, fromFrame = true) {
    if (!fromFrame && shaped) return;
    shaped = shaped || fromFrame;
    document.documentElement.style.setProperty("--ar", (w / h).toFixed(4));
    canvas.width = w;
    canvas.height = h;
  }

  async function draw() {
    if (decoding || !pending) return;
    decoding = true;
    const blob = pending;
    pending = null;
    try {
      const bitmap = await createImageBitmap(blob);
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();
    } finally {
      decoding = false;
      if (pending) draw();
    }
  }

  function connect() {
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${location.pathname.replace(/\/$/, "")}/ws`);
    ws.binaryType = "blob";
    ws.onopen = () => { retry = 0; loadInfo(); if (eventsWanted()) loadEvents(); };
    ws.onmessage = (e) => {
      if (typeof e.data === "string") {
        const m = JSON.parse(e.data);
        if (m.t === "frame") setShape(m.w, m.h);
        else if (m.t === "clipboard") receiveClipboard(m.text);
        else if (m.t === "event") addEvent(m.event);
        return;
      }
      setState(true);
      pending = e.data;
      draw();
    };
    ws.onclose = () => {
      setState(false);
      setTimeout(connect, Math.min(4000, 250 * 2 ** retry++));
    };
  }

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }

  function point(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
    };
  }

  // Pointers. Each finger gets a touch id 0-9. Alt/Option-drag with a mouse adds a second finger mirrored
  // around the screen centre (pinch, like Android Studio).
  const dot = document.getElementById("touch-dot");
  const extraDots = new Map();
  function dotAt(el, p) {
    const s = screen.getBoundingClientRect(), c = canvas.getBoundingClientRect();
    el.style.transform = `translate3d(${c.left - s.left + p.x * c.width}px, ${c.top - s.top + p.y * c.height}px, 0)`;
  }
  function extraDot(key) {
    let el = extraDots.get(key);
    if (!el) {
      el = dot.cloneNode(true);
      el.removeAttribute("id");
      el.classList.add("pair");
      screen.append(el);
      extraDots.set(key, el);
    }
    return el;
  }
  function hideExtra(key) {
    const el = extraDots.get(key);
    if (el) el.classList.remove("on", "down");
  }
  const mirror = (p) => ({ x: 1 - p.x, y: 1 - p.y });
  let hovering = null;
  function moveDot(e) {
    if (e.pointerType === "touch") return dot.classList.remove("on");
    const r = screen.getBoundingClientRect();
    const x = Math.min(r.width, Math.max(0, e.clientX - r.left));
    const y = Math.min(r.height, Math.max(0, e.clientY - r.top));
    dot.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    dot.classList.add("on");
    hovering = point(e);
    showPairHint(e.altKey);
  }
  function showPairHint(alt) {
    const f = fingers.get(mousePointer);
    if (f?.pair !== undefined) return;
    if (alt && hovering && pointerHere) {
      const el = extraDot("hint");
      dotAt(el, mirror(hovering));
      el.classList.add("on");
    } else hideExtra("hint");
  }
  let pointerHere = false, mousePointer = null;
  screen.addEventListener("pointerenter", (e) => { pointerHere = true; moveDot(e); });
  screen.addEventListener("pointermove", moveDot);
  screen.addEventListener("pointerleave", () => {
    pointerHere = false;
    hovering = null;
    if (!fingers.size) dot.classList.remove("on");
    hideExtra("hint");
  });
  window.addEventListener("keydown", (e) => { if (e.key === "Alt") showPairHint(true); });
  window.addEventListener("keyup", (e) => { if (e.key === "Alt") showPairHint(false); });
  window.addEventListener("blur", () => showPairHint(false));

  const fingers = new Map();
  const moves = new Map();
  let moveFrame = 0;
  function freeId() {
    const used = new Set();
    fingers.forEach((f) => { used.add(f.id); if (f.pair !== undefined) used.add(f.pair); });
    for (let i = 0; i < 10; i++) if (!used.has(i)) return i;
    return -1;
  }
  function sendFinger(f, p, down) {
    send({ t: "touch", id: f.id, down, ...p });
    if (f.pair !== undefined) {
      const m = mirror(p);
      send({ t: "touch", id: f.pair, down, ...m });
      const el = extraDot("pinch");
      dotAt(el, m);
      el.classList.toggle("on", down);
      el.classList.toggle("down", down);
    }
  }
  function flushMoves() {
    moveFrame = 0;
    moves.forEach((p, pid) => { const f = fingers.get(pid); if (f) sendFinger(f, p, true); });
    moves.clear();
  }
  screen.addEventListener("pointerdown", (e) => {
    const touch = e.pointerType === "touch" || e.pointerType === "pen";
    if (!touch && (e.button !== 0 || mousePointer !== null)) return;
    const id = freeId();
    if (id < 0) return;
    const f = { id };
    fingers.set(e.pointerId, f);
    if (!touch) {
      mousePointer = e.pointerId;
      if (e.altKey) {
        hideExtra("hint");
        const pair = freeId();
        if (pair >= 0) f.pair = pair;
      }
    }
    screen.setPointerCapture(e.pointerId);
    if (!touch) dot.classList.add("down");
    screen.focus({ preventScroll: true });
    sendFinger(f, point(e), true);
  });
  screen.addEventListener("pointermove", (e) => {
    if (!fingers.has(e.pointerId)) return;
    moves.set(e.pointerId, point(e));
    if (!moveFrame) moveFrame = requestAnimationFrame(flushMoves);
  });
  const release = (e) => {
    const f = fingers.get(e.pointerId);
    if (!f) return;
    fingers.delete(e.pointerId);
    moves.delete(e.pointerId);
    if (e.pointerId === mousePointer) {
      mousePointer = null;
      dot.classList.remove("down");
      const r = screen.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dot.classList.remove("on");
    }
    sendFinger(f, point(e), false);
    if (e.altKey && pointerHere) showPairHint(true);
  };
  screen.addEventListener("pointerup", release);
  screen.addEventListener("pointercancel", release);
  screen.addEventListener("lostpointercapture", release);
  screen.addEventListener("contextmenu", (e) => e.preventDefault());

  // Wheel scrolls; a trackpad pinch (Chrome sends it as wheel + ctrlKey) zooms with api/pinch.
  let wheel = null, zoom = null, zoomTimer = 0;
  screen.addEventListener("wheel", (e) => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? screen.clientHeight : 1;
    if (e.ctrlKey) {
      zoom = zoom || { ...point(e), scale: 1 };
      zoom.scale *= Math.exp(-e.deltaY * unit / 100);
      clearTimeout(zoomTimer);
      zoomTimer = setTimeout(sendZoom, 120);
      return;
    }
    if (!wheel) {
      wheel = { ...point(e), dx: 0, dy: 0 };
      requestAnimationFrame(() => { if (wheel.dx || wheel.dy) send({ t: "wheel", ...wheel }); wheel = null; });
    }
    wheel.dx += (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * unit;
    wheel.dy += (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * unit;
  }, { passive: false });
  function sendZoom() {
    const z = zoom;
    zoom = null;
    const scale = Math.min(5, Math.max(0.2, z.scale));
    if (Math.abs(Math.log(scale)) < 0.05 || !deviceSize) return;
    const [w, h] = (canvas.width > canvas.height) === (deviceSize[0] > deviceSize[1]) ? deviceSize : [deviceSize[1], deviceSize[0]];
    post("api/pinch", { x: Math.round(z.x * (w - 1)), y: Math.round(z.y * (h - 1)), scale: +scale.toFixed(3), duration_ms: 300 });
  }

  const specialKeys = new Set(["Backspace", "Enter", "Tab", "Delete", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "PageUp", "PageDown"]);
  screen.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") send({ t: "key", key: "GoBack" });
    else if (specialKeys.has(e.key)) send({ t: "key", key: e.key });
    else if (e.key.length === 1) send({ t: "text", text: e.key });
    else return;
    e.preventDefault();
    e.stopPropagation();
  });
  screen.addEventListener("paste", (e) => {
    const text = e.clipboardData.getData("text");
    if (text) send({ t: "text", text });
  });

  document.querySelectorAll("[data-key]").forEach((b) => b.addEventListener("click", () => send({ t: "key", key: b.dataset.key })));
  document.getElementById("rotate").addEventListener("click", () => send({ t: "rotate" }));
  document.getElementById("shot").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = "screenshot";
    a.download = `screenshot-${new Date().toISOString().replace(/[:.]/g, "-")}.png`;
    a.click();
  });

  const $ = (id) => document.getElementById(id);

  function note(id, text, error = false) {
    $(id).textContent = text || "";
    $(id).classList.toggle("error", error);
  }

  async function post(path, body, noteId) {
    try {
      const r = await fetch(path, {
        method: "POST",
        headers: body instanceof Blob ? { "Content-Type": "application/vnd.android.package-archive" } : { "Content-Type": "application/json" },
        body: body instanceof Blob ? body : JSON.stringify(body),
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error);
      if (noteId) note(noteId, "");
      return data;
    } catch (err) {
      if (noteId) note(noteId, err.message || "Request failed", true);
      return null;
    }
  }

  async function get(path, noteId) {
    try {
      const r = await fetch(path);
      const data = await r.json();
      if (!data.ok) throw new Error(data.error);
      if (noteId) note(noteId, "");
      return data;
    } catch (err) {
      if (noteId) note(noteId, err.message || "Request failed", true);
      return null;
    }
  }

  function flash(id, text) {
    note(id, text);
    setTimeout(() => { if ($(id).textContent === text) note(id, ""); }, 2500);
  }

  async function loadInfo() {
    try {
      const i = await (await fetch("info")).json();
      $("label").textContent = i.label;
      deviceSize = [i.width, i.height];
      setShape(i.width, i.height, false);
      $("i-model").textContent = i.label;
      const trim = (v) => String(v).replace(/\.0$/, "");
      $("i-android").textContent = i.android ? `${trim(i.android)} (API ${trim(i.api)})` : "–";
      $("i-display").textContent = `${i.width} × ${i.height}${i.density ? ` · ${i.density} dpi` : ""}`;
      $("i-memory").textContent = i.ram ? `${(i.ram / 1024).toFixed(i.ram % 1024 ? 1 : 0)} GB · ${i.cores} cores` : "–";
      $("i-emulator").textContent = i.emulator || "–";
    } catch {}
  }

  async function loadState() {
    try {
      const st = await (await fetch("api/state")).json();
      if (!st.ok) return;
      if (st.dark !== null) setAppearance(st.dark);
      if (st.battery) {
        $("battery").value = st.battery.level;
        $("charging").checked = st.battery.charging;
        showBattery();
      }
      if (st.location && document.activeElement !== $("lat") && document.activeElement !== $("lng")) {
        $("lat").value = +st.location.lat.toFixed(6);
        $("lng").value = +st.location.lng.toFixed(6);
      }
      receiveClipboard(st.clipboard);
    } catch {}
  }

  const root = document.documentElement;
  const panel = $("panel");
  const toggle = $("panel-toggle");
  function setPanel(open, save = true) {
    root.classList.toggle("panel-open", open);
    toggle.setAttribute("aria-expanded", String(open));
    if (open) {
      panel.hidden = false;
      loadState();
      loadControls();
    } else {
      root.classList.remove("log-open", "events-open");
      const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 240;
      setTimeout(() => { if (!root.classList.contains("panel-open")) panel.hidden = true; }, delay);
    }
    if (save) localStorage.setItem("panel", open ? "1" : "0");
    if (open) selectTab(localStorage.getItem("tab") || "controls", false);
    syncLogcat();
  }
  toggle.addEventListener("click", () => setPanel(!root.classList.contains("panel-open")));
  $("scrim").addEventListener("click", () => setPanel(false));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.activeElement !== screen && root.classList.contains("panel-open") && matchMedia("(max-width: 899px)").matches) setPanel(false);
  });
  const LEVELS = "VDIWEFA";
  const logEl = $("log");
  let logs = [], logSocket = null, logRetry = 0, paused = false, fgPids = null, fgTimer = null;
  let activeTab = "controls";

  const TABS = ["controls", "logcat", "events"];
  function selectTab(name, save = true) {
    activeTab = TABS.includes(name) ? name : "controls";
    document.querySelectorAll("[data-tab]").forEach((b) => {
      const on = b.dataset.tab === activeTab;
      b.setAttribute("aria-selected", String(on));
      b.setAttribute("aria-pressed", String(on));
    });
    TABS.forEach((t) => { $(`tab-${t}`).hidden = activeTab !== t; });
    const open = root.classList.contains("panel-open");
    root.classList.toggle("log-open", activeTab === "logcat" && open);
    root.classList.toggle("events-open", activeTab === "events" && open);
    if (save) localStorage.setItem("tab", activeTab);
    syncLogcat();
    if (eventsWanted()) loadEvents();
  }
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => selectTab(b.dataset.tab)));

  function logcatWanted() { return root.classList.contains("panel-open") && activeTab === "logcat"; }

  function syncLogcat() {
    if (logcatWanted() && !logSocket) openLogcat();
    if (!logcatWanted() && logSocket) { const s = logSocket; logSocket = null; s.close(); }
    pollForeground();
  }

  function openLogcat() {
    const s = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${location.pathname.replace(/\/$/, "")}/logcat`);
    logSocket = s;
    s.onopen = () => { logRetry = 0; logs = []; renderLogs(); };
    s.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.t === "lines") addLogs(m.lines);
    };
    s.onclose = () => {
      if (logSocket !== s) return;
      logSocket = null;
      if (logcatWanted()) setTimeout(() => { if (logcatWanted() && !logSocket) openLogcat(); }, Math.min(4000, 250 * 2 ** logRetry++));
    };
  }

  function matches(entry) {
    const [, pid, , level, tag, msg] = entry;
    if (LEVELS.indexOf(level) < LEVELS.indexOf($("log-level").value)) return false;
    if (fgPids && !fgPids.has(pid)) return false;
    const q = $("log-filter").value.trim().toLowerCase();
    return !q || tag.toLowerCase().includes(q) || msg.toLowerCase().includes(q);
  }

  function lineNode(entry) {
    const [ts, , , level, tag, msg] = entry;
    const div = document.createElement("div");
    div.className = level;
    div.innerHTML = '<span class="ts"></span> <span class="lv"></span> <span class="tag"></span> <span class="msg"></span>';
    div.children[0].textContent = ts;
    div.children[1].textContent = level;
    div.children[2].textContent = tag;
    div.children[3].textContent = msg;
    return div;
  }

  function atBottom() { return logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 24; }

  function showEmpty() {
    if (logEl.childElementCount) return;
    const p = document.createElement("p");
    p.className = "log-empty";
    p.textContent = logs.length ? "No lines match" : "Waiting for logs…";
    logEl.append(p);
  }

  function renderLogs() {
    logEl.replaceChildren(...logs.filter(matches).slice(-2000).map(lineNode));
    showEmpty();
    logEl.scrollTop = logEl.scrollHeight;
  }

  function addLogs(lines) {
    logs.push(...lines);
    if (logs.length > 4000) logs = logs.slice(-2000);
    if (paused) return;
    const stick = atBottom();
    const fresh = lines.filter(matches);
    if (!fresh.length) return showEmpty();
    logEl.querySelector(".log-empty")?.remove();
    const frag = document.createDocumentFragment();
    fresh.forEach((e) => frag.append(lineNode(e)));
    logEl.append(frag);
    while (logEl.childElementCount > 2000) logEl.firstElementChild.remove();
    if (stick) logEl.scrollTop = logEl.scrollHeight;
  }

  async function pollForeground() {
    clearTimeout(fgTimer);
    if (!$("log-fg").checked || !logcatWanted()) {
      if (!$("log-fg").checked) { fgPids = null; $("log-app").textContent = ""; }
      return;
    }
    try {
      const r = await (await fetch("api/foreground")).json();
      const next = new Set(r.pids || []);
      const changed = !fgPids || next.size !== fgPids.size || [...next].some((p) => !fgPids.has(p));
      fgPids = next;
      $("log-app").textContent = r.package || "";
      if (changed) renderLogs();
    } catch {}
    fgTimer = setTimeout(pollForeground, 3000);
  }

  let filterTimer = null;
  $("log-filter").addEventListener("input", () => { clearTimeout(filterTimer); filterTimer = setTimeout(renderLogs, 120); });
  $("log-level").addEventListener("change", renderLogs);
  $("log-fg").addEventListener("change", () => { if (!$("log-fg").checked) { fgPids = null; renderLogs(); } pollForeground(); });
  $("log-pause").addEventListener("click", () => {
    paused = !paused;
    const b = $("log-pause");
    b.setAttribute("aria-pressed", String(paused));
    b.setAttribute("aria-label", paused ? "Resume" : "Pause");
    b.title = paused ? "Resume" : "Pause";
    b.firstElementChild.innerHTML = paused ? '<path d="M8 5.5v13l10.5-6.5z"/>' : '<path d="M9 6v12M15 6v12"/>';
    if (!paused) renderLogs();
  });
  $("log-clear").addEventListener("click", () => { logs = []; renderLogs(); });


  const clip = $("clip");
  let clipTimer = null, clipPending = null;
  function receiveClipboard(text) {
    if (text === undefined || text === null) return;
    if (document.activeElement === clip) clipPending = text;
    else clip.value = text;
  }
  function pushClipboard() {
    clearTimeout(clipTimer);
    clipTimer = null;
    post("api/clipboard", { text: clip.value }, "clip-note");
  }
  clip.addEventListener("input", () => {
    clearTimeout(clipTimer);
    clipTimer = setTimeout(pushClipboard, 400);
  });
  clip.addEventListener("blur", () => {
    if (clipTimer) pushClipboard();
    else if (clipPending !== null && clipPending !== clip.value) clip.value = clipPending;
    clipPending = null;
  });
  $("clip-copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(clip.value);
    } catch {
      clip.select();
      document.execCommand("copy");
      clip.setSelectionRange(clip.value.length, clip.value.length);
    }
    note("clip-note", "Copied to this computer");
    setTimeout(() => { if ($("clip-note").textContent === "Copied to this computer") note("clip-note", ""); }, 1500);
  });

  $("url-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if ($("url").value.trim()) await post("api/open-url", { url: $("url").value }, "url-note");
  });

  function setAppearance(dark) {
    document.querySelectorAll("[data-dark]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.dark === String(dark))));
  }
  document.querySelectorAll("[data-dark]").forEach((b) => b.addEventListener("click", async () => {
    const dark = b.dataset.dark === "true";
    setAppearance(dark);
    if (!(await post("api/appearance", { dark }, "appearance-note"))) setAppearance(!dark);
  }));

  function showBattery() { $("battery-value").textContent = `${$("battery").value}%`; }
  const sendBattery = () => post("api/battery", { level: +$("battery").value, charging: $("charging").checked }, "battery-note");
  $("battery").addEventListener("input", showBattery);
  $("battery").addEventListener("change", sendBattery);
  $("charging").addEventListener("change", sendBattery);

  $("loc-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const lat = parseFloat($("lat").value), lng = parseFloat($("lng").value);
    if (Number.isNaN(lat) || Number.isNaN(lng)) return note("loc-note", "Enter a latitude and longitude", true);
    if (await post("api/location", { lat, lng }, "loc-note")) note("loc-note", "Location set");
  });

  // Apps
  const ICON = {
    launch: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
    stop: '<svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>',
    clear: '<svg viewBox="0 0 24 24"><path d="M8.5 19 4 14.5 13.5 5l6.5 6.5-7.5 7.5z"/><path d="m8.5 9.5 6 6"/><path d="M8.5 19H20"/></svg>',
    load: '<svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>',
    delete: '<svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M10 11v6M14 11v6"/><path d="M6.5 7l.8 11a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9l.8-11"/><path d="M9.5 7V5.5a1.5 1.5 0 0 1 1.5-1.5h2a1.5 1.5 0 0 1 1.5 1.5V7"/></svg>',
  };
  function actionButton(act, label) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.act = act;
    b.setAttribute("aria-label", label);
    b.title = label;
    b.innerHTML = ICON[act];
    return b;
  }
  function listItem(name, meta, buttons, title) {
    const li = document.createElement("li");
    li.dataset.name = name;
    const n = document.createElement("span");
    n.className = "name";
    n.textContent = name;
    n.title = title || name;
    li.append(n);
    if (meta) {
      const m = document.createElement("span");
      m.className = "meta";
      m.textContent = meta;
      li.append(m);
    }
    li.append(...buttons);
    return li;
  }
  function emptyItem(text) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = text;
    return li;
  }
  // Destructive actions take a second click within 3 s instead of a dialog.
  function confirmed(b, label) {
    if (b.classList.contains("confirm")) {
      clearTimeout(b.confirmTimer);
      b.classList.remove("confirm");
      return true;
    }
    const old = b.title;
    b.classList.add("confirm");
    b.title = label;
    b.setAttribute("aria-label", label);
    b.confirmTimer = setTimeout(() => { b.classList.remove("confirm"); b.title = old; b.setAttribute("aria-label", old); }, 3000);
    return false;
  }

  let apps = [];
  async function loadApps() {
    const r = await get($("apps-all").checked ? "api/apps?all=true" : "api/apps", "apps-note");
    if (!r) return;
    apps = (r.packages || []).slice().sort();
    renderApps();
  }
  function renderApps() {
    const many = apps.length > 8;
    $("apps-filter").hidden = !many;
    const q = many ? $("apps-filter").value.trim().toLowerCase() : "";
    const shown = apps.filter((p) => p.toLowerCase().includes(q));
    $("apps").replaceChildren(...(shown.length
      ? shown.map((p) => listItem(p, "", [actionButton("launch", "Open"), actionButton("stop", "Force stop"), actionButton("clear", "Clear data")]))
      : [emptyItem(apps.length ? "No apps match" : "No apps installed")]));
  }
  $("apps-refresh").addEventListener("click", loadApps);
  $("apps-all").addEventListener("change", loadApps);
  $("apps-filter").addEventListener("input", renderApps);
  $("apps").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const pkg = b.closest("li").dataset.name;
    const act = b.dataset.act;
    if (act === "clear" && !confirmed(b, "Click again to clear data")) return;
    const r = await post("api/app", { action: act, package: pkg }, "apps-note");
    if (r) flash("apps-note", { launch: `Opened ${pkg}`, stop: `Stopped ${pkg}`, clear: `Cleared data for ${pkg}` }[act]);
  });

  // Snapshots
  function snapMeta(s) {
    if (s.size_bytes) {
      const mb = s.size_bytes / 1048576;
      return mb >= 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${Math.round(mb)} MB`;
    }
    return "";
  }
  function snapDate(s) {
    if (s.created === undefined || s.created === null) return "";
    const t = typeof s.created === "number" ? (s.created < 1e12 ? s.created * 1000 : s.created) : Date.parse(s.created);
    return Number.isNaN(t) ? "" : new Date(t).toLocaleString();
  }
  async function loadSnaps() {
    const r = await post("api/snapshots", { action: "list" }, "snaps-note");
    if (!r) return;
    const snaps = r.snapshots || [];
    $("snaps").replaceChildren(...(snaps.length
      ? snaps.map((s) => listItem(s.name, snapMeta(s), [actionButton("load", "Load"), actionButton("delete", "Delete")], [s.name, snapDate(s)].filter(Boolean).join(" · ")))
      : [emptyItem("No snapshots")]));
  }
  $("snaps-refresh").addEventListener("click", loadSnaps);
  $("snaps").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const name = b.closest("li").dataset.name;
    if (b.dataset.act === "delete") {
      if (!confirmed(b, "Click again to delete")) return;
      if (await post("api/snapshots", { action: "delete", name }, "snaps-note")) { flash("snaps-note", `Deleted ${name}`); loadSnaps(); }
      return;
    }
    note("snaps-note", `Loading ${name}…`);
    if (await post("api/snapshots", { action: "load", name }, "snaps-note")) flash("snaps-note", `Loaded ${name}`);
  });
  $("snap-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const d = new Date(), z = (n) => String(n).padStart(2, "0");
    const name = $("snap-name").value.trim() || `snap-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
    $("snap-save").disabled = true;
    note("snaps-note", `Saving ${name}…`);
    const r = await post("api/snapshots", { action: "save", name }, "snaps-note");
    $("snap-save").disabled = false;
    if (!r) return;
    $("snap-name").value = "";
    flash("snaps-note", `Saved ${name}`);
    loadSnaps();
  });

  // Network
  function showNetwork(n) {
    if (!n) return;
    for (const k of ["airplane", "wifi", "data"]) if (typeof n[k] === "boolean") $(`net-${k}`).checked = n[k];
    document.querySelectorAll("[data-speed]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.speed === n.speed)));
  }
  async function setNetwork(change) {
    showNetwork(await post("api/network", change, "net-note"));
  }
  ["airplane", "wifi", "data"].forEach((k) => $(`net-${k}`).addEventListener("change", (e) => setNetwork({ [k]: e.target.checked })));
  document.querySelectorAll("[data-speed]").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("[data-speed]").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
    setNetwork({ speed: b.dataset.speed });
  }));

  // Accessibility
  const FONT_SCALES = [0.85, 1, 1.15, 1.3, 1.5, 1.8, 2];
  const FONT_NAMES = ["Small", "Default", "Large", "Larger", "Largest", "Huge", "Huge+"];
  function showFontScale() {
    const i = +$("font-scale").value;
    $("font-scale-value").textContent = `${FONT_SCALES[i]}×`;
    $("font-scale").setAttribute("aria-valuetext", `${FONT_NAMES[i]}, ${FONT_SCALES[i]} times`);
  }
  function showA11y(a) {
    if (!a || typeof a.font_scale !== "number" || document.activeElement === $("font-scale")) return;
    let best = 0;
    FONT_SCALES.forEach((v, i) => { if (Math.abs(v - a.font_scale) < Math.abs(FONT_SCALES[best] - a.font_scale)) best = i; });
    $("font-scale").value = best;
    showFontScale();
  }
  $("font-scale").addEventListener("input", showFontScale);
  $("font-scale").addEventListener("change", async () => showA11y(await post("api/accessibility", { font_scale: FONT_SCALES[+$("font-scale").value] }, "a11y-note")));

  // Phone
  function phoneNumber() {
    const n = $("phone-number").value.trim();
    if (!n) note("phone-note", "Enter a phone number", true);
    return n;
  }
  $("sms-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const number = phoneNumber(), text = $("sms-text").value;
    if (!number) return;
    if (!text.trim()) return note("phone-note", "Type a message", true);
    if (await post("api/sms", { number, text }, "phone-note")) { $("sms-text").value = ""; flash("phone-note", `SMS sent from ${number}`); }
  });
  $("call").addEventListener("click", async () => {
    const number = phoneNumber();
    if (number && await post("api/phone", { number, action: "call" }, "phone-note")) flash("phone-note", `Incoming call from ${number}`);
  });
  $("hangup").addEventListener("click", async () => {
    const number = phoneNumber();
    if (number && await post("api/phone", { number, action: "end" }, "phone-note")) flash("phone-note", "Call ended");
  });

  function loadControls() {
    loadApps();
    loadSnaps();
    post("api/network", {}, "net-note").then(showNetwork);
    post("api/accessibility", {}, "a11y-note").then(showA11y);
  }

  // Events: every API call and UI gesture, live from the WebSocket.
  const evEl = $("events");
  let events = [];
  function eventsWanted() { return root.classList.contains("panel-open") && activeTab === "events"; }
  function evText(e) {
    const params = Object.entries(e.params || {}).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" ");
    return e.ok === false && e.error ? `${params}${params ? " · " : ""}${e.error}` : params;
  }
  function evMatches(e) {
    const q = $("ev-filter").value.trim().toLowerCase();
    return !q || `${e.source} ${e.action} ${evText(e)}`.toLowerCase().includes(q);
  }
  function evNode(e) {
    const div = document.createElement("div");
    if (e.ok === false) div.className = "fail";
    div.innerHTML = '<span class="ts"></span> <span class="src"></span> <span class="act"></span> <span class="msg"></span>';
    const t = new Date(e.time);
    div.children[0].textContent = Number.isNaN(t.getTime()) ? "" : t.toLocaleTimeString([], { hour12: false });
    div.children[1].textContent = e.source || "";
    div.children[2].textContent = e.action;
    div.children[3].textContent = evText(e);
    return div;
  }
  function evEmpty() {
    if (evEl.childElementCount) return;
    const p = document.createElement("p");
    p.className = "log-empty";
    p.textContent = events.length ? "No events match" : "No events yet. Taps, keys and API calls show up here.";
    evEl.append(p);
  }
  function renderEvents() {
    evEl.replaceChildren(...events.filter(evMatches).map(evNode));
    evEmpty();
    evEl.scrollTop = evEl.scrollHeight;
  }
  function addEvent(e) {
    if (!e || events.some((x) => x.id === e.id)) return;
    events.push(e);
    if (events.length > 1000) events = events.slice(-1000);
    if (!eventsWanted() || !evMatches(e)) return;
    const stick = evEl.scrollTop + evEl.clientHeight >= evEl.scrollHeight - 24;
    evEl.querySelector(".log-empty")?.remove();
    evEl.append(evNode(e));
    while (evEl.childElementCount > 1000) evEl.firstElementChild.remove();
    if (stick) evEl.scrollTop = evEl.scrollHeight;
  }
  async function loadEvents() {
    const r = await get("api/events?limit=200", "ev-note");
    if (r) {
      const known = new Set(events.map((e) => e.id));
      events = [...events, ...(r.events || []).filter((e) => !known.has(e.id))].sort((a, b) => a.time - b.time).slice(-1000);
    }
    renderEvents();
  }
  let evTimer = 0;
  $("ev-filter").addEventListener("input", () => { clearTimeout(evTimer); evTimer = setTimeout(renderEvents, 120); });
  $("ev-export").addEventListener("click", async () => {
    const r = await get("api/events/script", "ev-note");
    if (!r) return;
    delete r.ok;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(r, null, 2)], { type: "application/json" }));
    a.download = `serve-droid-script-${new Date().toISOString().replace(/[:.]/g, "-")}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    flash("ev-note", `Exported ${r.steps?.length ?? 0} steps`);
  });

  async function install(file) {
    if (!file) return;
    if (!/\.apk$/i.test(file.name)) return note("apk-note", "Choose an .apk file", true);
    $("apk-pick").disabled = true;
    note("apk-note", `Installing ${file.name}…`);
    const r = await post("api/install", file, "apk-note");
    if (r) note("apk-note", r.package ? `Installed and opened ${r.package}` : `Installed ${file.name}`);
    $("apk-pick").disabled = false;
    $("apk").value = "";
  }
  $("apk-pick").addEventListener("click", () => $("apk").click());
  $("apk").addEventListener("change", () => install($("apk").files[0]));
  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => {
    if (![...e.dataTransfer.types].includes("Files")) return;
    e.preventDefault();
    dragDepth++;
    document.body.classList.add("dropping");
  });
  window.addEventListener("dragover", (e) => { if ([...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
  window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dropping"); } });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove("dropping");
    if (!root.classList.contains("panel-open")) setPanel(true);
    install(e.dataTransfer.files[0]);
  });

  setPanel(localStorage.getItem("panel") === "1" || (localStorage.getItem("panel") === null && matchMedia("(min-width: 1200px)").matches), false);
  loadInfo().finally(connect);
</script>
<script>
  // WebMCP: expose the device to in-browser agents. https://webmachinelearning.github.io/webmcp/
  // Tools come from the server's manifest (tools.json), shared with `serve-droid mcp`.
  (() => {
    const mc = document.modelContext ?? navigator.modelContext;
    if (!mc?.registerTool) return;

    const clean = (input) => Object.fromEntries(Object.entries(input || {}).filter(([, v]) => v !== undefined && v !== null && v !== ""));
    async function call({ method = "POST", path }, input) {
      const rel = path.replace(/^\/+/, "");
      const get = method.toUpperCase() === "GET";
      const query = get ? new URLSearchParams(Object.entries(clean(input)).map(([k, v]) => [k, typeof v === "object" ? JSON.stringify(v) : String(v)])).toString() : "";
      const r = await fetch(query ? `${rel}?${query}` : rel, get ? {} : {
        method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(input || {}),
      });
      let data;
      try { data = await r.json(); } catch { throw new Error(`${rel}: HTTP ${r.status}`); }
      if (!data.ok) throw new Error(data.error || `${rel} failed`);
      delete data.ok;
      return data;
    }

    let screenSize = null;
    async function oriented() {
      if (!screenSize) {
        const i = await (await fetch("info")).json();
        screenSize = [i.width, i.height];
      }
      const [w, h] = screenSize;
      const c = document.getElementById("canvas");
      return (c.width > c.height) === (w > h) ? [w, h] : [h, w];
    }

    // Show where an agent touches the screen.
    async function showTouch(x, y, ms = 220) {
      if (typeof x !== "number" || typeof y !== "number") return;
      const [w, h] = await oriented();
      const dot = document.getElementById("touch-dot");
      const s = document.getElementById("screen").getBoundingClientRect();
      const c = document.getElementById("canvas").getBoundingClientRect();
      dot.style.transform = `translate3d(${c.left - s.left + (x / w) * c.width}px, ${c.top - s.top + (y / h) * c.height}px, 0)`;
      dot.classList.add("on", "down");
      clearTimeout(showTouch.timer);
      showTouch.timer = setTimeout(() => dot.classList.remove("on", "down"), ms);
    }
    const extras = {
      async tap(input, run) {
        const shown = typeof input.x === "number";
        if (shown) showTouch(input.x, input.y, Math.max(220, input.duration_ms || 0));
        const r = await run();
        if (!shown) showTouch(r.x, r.y, Math.max(220, input.duration_ms || 0));
        return r;
      },
      async swipe(input, run) { showTouch(input.x2, input.y2, input.duration_ms || 300); return run(); },
      async scroll(input, run) { showTouch(input.x, input.y, 400); return run(); },
      async pinch(input, run) { showTouch(input.x, input.y, input.duration_ms || 400); return run(); },
    };

    async function register() {
      const r = await fetch("tools.json");
      if (!r.ok) throw new Error(`tools.json: HTTP ${r.status}`);
      const manifest = await r.json();
      const results = await Promise.allSettled(manifest.map(async (t) => {
        const annotations = { ...t.annotations };
        if (annotations.readOnlyHint || t.name === "run_shell") annotations.untrustedContentHint = true;
        const extra = extras[t.name];
        await mc.registerTool({
          name: t.name,
          title: t.title,
          description: t.description,
          inputSchema: t.inputSchema || { type: "object", properties: {} },
          annotations,
          execute: (input = {}) => {
            const run = () => call(t.http, input);
            return extra ? extra(input, run) : run();
          },
        });
      }));
      results.forEach((res, i) => res.status === "rejected" && console.warn(`WebMCP: ${manifest[i].name} not registered`, res.reason));
    }

    const done = register().catch((err) => console.warn("WebMCP: no tools", err));
    mc.waitForToolsUntil?.(done);
  })();
</script>
</body>
