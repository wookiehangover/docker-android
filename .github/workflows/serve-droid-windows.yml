name: serve-droid Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/serve-droid/**'
      - '.github/workflows/serve-droid-windows.yml'

jobs:
  native:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout the repo
      uses: actions/checkout@v7

    - name: Install the CLI from a packed tarball
      run: |
        node --version
        npm pack ./packages/serve-droid --pack-destination "$RUNNER_TEMP"
        mkdir "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj" && git init -q
        npm install --no-audit --no-fund "$RUNNER_TEMP"/serve-droid-*.tgz

    - name: Make sure the SDK has the emulator
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" emulator platform-tools

    - name: Start a native emulator
      env:
        SERVE_DROID_PYTHON_SETUP: uv
      run: |
        cd "$RUNNER_TEMP/proj"
        cli=./node_modules/.bin/serve-droid
        if url=$("$cli" start --name ci 2> start.log); then
          cat start.log
          curl -sf "${url}info"
          curl -sf -o "$RUNNER_TEMP/windows.png" "${url}screenshot"
          "$cli" ls
          "$cli" logs --name ci | tail -5
          "$cli" rm --name ci --yes
        else
          cat start.log
          # Hosted runners usually have no Windows Hypervisor Platform. The CLI must say how to fix that.
          grep -q "Windows Hypervisor Platform" start.log
        fi

    - name: Serve the browser UI on the Windows event loop
      run: |
        cd "$RUNNER_TEMP/proj"
        python=.serve-droid/.venv/Scripts/python.exe
        ui=node_modules/serve-droid/web-ui
        proto=$(cygpath -u "$ANDROID_HOME")/emulator/lib
        generated="$RUNNER_TEMP/generated" && mkdir -p "$generated"
        "$python" -m grpc_tools.protoc -I"$proto" --python_out="$generated" --grpc_python_out="$generated" \
          "$proto/emulator_controller.proto"
        EMULATOR_PROTO_PATH=$(cygpath -w "$generated") "$python" "$ui/server.py" \
          --host 127.0.0.1 --port 6091 --grpc localhost:9 > server.log 2>&1 &
        for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:6091/ && break; sleep 1; done
        curl -sf -o /dev/null http://127.0.0.1:6091/
        kill %1 || true
        cat server.log

    - name: Keep the screenshot
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: serve-droid-windows
        path: ${{ runner.temp }}/windows.png
        if-no-files-found: ignore
