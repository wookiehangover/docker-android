name: serve-droid release

on:
  push:
    tags:
      - 'serve-droid-v*'

permissions:
  contents: write

jobs:
  github_release:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout the repo
      uses: actions/checkout@v7

    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="${GITHUB_REF_NAME#serve-droid-v}"
        test "$(jq -r .version packages/serve-droid/package.json)" = "$version"
        node packages/serve-droid/scripts/release.mjs --notes "$version" > "$RUNNER_TEMP/notes.md"
        gh release create "$GITHUB_REF_NAME" --verify-tag --title "serve-droid v$version" --notes-file "$RUNNER_TEMP/notes.md"
